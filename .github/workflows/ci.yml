name: CI

# The Cloudflare Worker deploys straight from main, so this is the only gate
# between a push and production. Keep it fast: no browsers, just lint,
# typecheck, tests, and a build that proves main is deployable. The build sets
# SKIP_NETWORK_PREPARE so it never depends on huggingface.co or jsdelivr.net
# (the model and pyodide stagers fetch from those on a cold cache); everything
# else the build needs comes from node_modules or committed repo files.
on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be replayed from the Actions tab without an empty commit, which
  # matters when a run is needed against an unchanged tree (a flake, or a
  # queue that dropped the original).
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails loudly when package.json and the lockfile disagree, which
      # is the whole point: it is also what Workers Builds runs, so a lockfile
      # that installs here installs there. See the lockfile rule in CLAUDE.md.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          SKIP_NETWORK_PREPARE: "1"
