# stack-template: dependabot/npm@1 eb5e18f484c9
version: 2

# Canonical Dependabot policy (stack standard deps.dependabot-policy):
#   - weekly, Monday 06:00 in the owner's timezone: one batch a week, not a daily flood
#   - one `minor-and-patch` PR per ecosystem; majors stay separate PRs so they get reviewed
#   - a `security` group so vulnerability fixes land together, any semver type
#   - cooldown: majors wait 14 days, minors 3, patches 0. GitHub applies a 3-day default to
#     everything when unconfigured; this overrides it so fresh major releases can settle
#     (most of our toolchain breakage was fresh-release breakage).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      # vue-tsc 3.3.12 to 3.3.14 turn `//` and `/*` inside a template attribute
      # value into a comment in the generated code (vuejs/language-tools#6322),
      # which breaks type checking of XPathTesterPanel and BatchProcessorPanel.
      # 3.3.11 is the newest clean release and is pinned exactly in
      # package.json. Drop this entry once a fixed version ships.
      - dependency-name: vue-tsc
        versions: ["3.3.12", "3.3.13", "3.3.14"]
      # typescript-eslint 8 caps its TypeScript peer below 6.1 and
      # @astrojs/check stops at 6.x, so TypeScript 7 cannot be checked yet.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # satori renders the Open Graph cards at build time. 0.63 resolves the
      # card's `100%` size against the padded frame's outer box, which pushed
      # the card off the canvas and clipped the footer (src/lib/og.test.ts now
      # catches that), and it rendered each card about 3x slower on the CI
      # runner (74 ms to 228 ms). Move past 0.29 by hand, with the layout
      # reworked and a look at the built /og/*.png files.
      - dependency-name: satori
        versions: [">=0.30.0"]
      # The in-browser ML runtime. onnxruntime-web is pinned (dependency and
      # override) because a newer transformers.js pin broke Whisper session
      # creation, and CI cannot run real inference, so a green run proves
      # nothing here. Bump these two together by hand and verify the
      # transcriber, background remover, upscaler and QR deep scan in a browser.
      - dependency-name: "@huggingface/transformers"
      - dependency-name: onnxruntime-web
      # The firmware flasher talks to a chip over Web Serial, so only flashing
      # a real board proves a new esptool-js works. 0.7 changed chip detection
      # and added input validation to writeFlash.
      - dependency-name: esptool-js
      # The three packages above are also pinned in
      # src/lib/held-dependencies.test.ts, which fails CI when their locked
      # version moves. These entries only stop the weekly noise; the test is
      # what keeps a bot from merging them, security updates included.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # No update-types here on purpose: a security fix is merged on green regardless
      # of semver type (D-DEP-6).
      security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 0
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Dependabot rejects the per-semver cooldown keys for github-actions (the
    # whole file fails validation), so this ecosystem gets the flat default.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(actions)"
